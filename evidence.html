<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证据库 | CarbSeek Insight</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* Filter Bar */
.filter-bar {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-select {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 6px 12px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
}
.filter-select:focus { border-color: var(--accent-blue); }
.filter-count { margin-left: auto; font-size: 13px; color: var(--text-secondary); }

/* Evidence Card */
.evidence-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
  cursor: pointer;
}
.evidence-card:hover { border-color: var(--accent-blue); }
.evidence-card:last-child { margin-bottom: 0; }

.evidence-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.evidence-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  padding: 2px 8px;
  border-radius: 4px;
}
.evidence-badges {
  display: flex;
  gap: 6px;
}
.evidence-badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
}
.evidence-badge.type-policy { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
.evidence-badge.type-academic { background: rgba(139, 92, 246, 0.1); color: var(--accent-purple); }
.evidence-badge.type-patent { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
.evidence-badge.type-competitor { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); }
.evidence-badge.type-industry { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
.evidence-badge.cred-high { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
.evidence-badge.cred-medium { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); }
.evidence-badge.cred-low { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
.evidence-badge.in-pool { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }

.evidence-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.5;
}

.evidence-source-row {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.evidence-source-row a {
  color: var(--accent-blue);
  text-decoration: none;
}
.evidence-source-row a:hover { text-decoration: underline; }

.evidence-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
}
.evidence-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.evidence-section-text {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-primary);
}
.evidence-section-text.secondary {
  color: var(--text-secondary);
}

.evidence-agent-box {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));
  border: 1px solid rgba(59, 130, 246, 0.15);
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 12px;
}
.evidence-agent-box .evidence-section-title {
  color: var(--accent-blue);
}

.evidence-related {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.evidence-related-tag {
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 11px;
  background: rgba(139, 92, 246, 0.1);
  color: var(--accent-purple);
  text-decoration: none;
}
.evidence-related-tag:hover {
  background: rgba(139, 92, 246, 0.2);
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>CarbSeek Insight</span>
    </div>
    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab">本周产业雷达</a>
      <a href="industry-chemical.html" class="nav-tab">化工</a>
      <a href="industry-electronics.html" class="nav-tab">电子电气</a>
      <a href="industry-automotive.html" class="nav-tab">汽车</a>
      <a href="industry-eu-export.html" class="nav-tab">欧盟出口</a>
      <a href="evidence.html" class="nav-tab active">证据库</a>
      <a href="opportunities.html" class="nav-tab">机会库</a>
    </nav>
    <div class="header-meta">
      <span id="report-meta"></span>
      <span id="evidence-total"></span>
    </div>
  </div>
</header>

<main class="main">

  <!-- Filter Bar(选项由 JS 按数据动态生成) -->
  <div class="filter-bar">
    <select class="filter-select" id="filter-industry"></select>
    <select class="filter-select" id="filter-type"></select>
    <select class="filter-select" id="filter-credibility"></select>
    <div class="filter-count" id="filter-count"></div>
  </div>

  <!-- Evidence Cards(由 evidence.js 渲染) -->
  <div id="evidence-list"></div>

  <!-- Footer -->
  <div style="margin-top: 40px; padding: 20px 0; border-top: 1px solid var(--border-color); text-align: center; font-size: 12px; color: var(--text-secondary);">
    <p>CarbSeek Insight · 碳产业研发情报智能体 · 每周自动更新 <span class="badge" style="background: rgba(245,158,11,0.15); color: var(--accent-amber);">演示数据</span></p>
  </div>

</main>

<script src="assets/js/evidence.js"></script>

</body>
</html>
