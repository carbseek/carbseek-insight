<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarbSeek Intelligence | 碳足迹研发情报中心</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* ===== Stats Grid(页面专属) ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  max-width: 1440px;
  margin: 24px auto 0;
  padding: 0 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.stat-value {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 4px;
}
.stat-label {
  font-size: 13px;
  color: var(--text-secondary);
}
.stat-total { color: var(--accent-blue); }
.stat-today { color: var(--accent-green); }
.stat-week { color: var(--accent-purple); }
.stat-high { color: var(--accent-amber); }
.stat-urgent { color: var(--accent-red); }

/* ===== Main Layout(页面专属:双栏) ===== */
.main {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 24px;
  padding-bottom: 40px;
}
.main .card { margin-bottom: 20px; }
.main .card:last-child { margin-bottom: 0; }

/* ===== Article Item ===== */
.article-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  gap: 12px;
}
.article-item:last-child { border-bottom: none; }
.article-badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  height: fit-content;
}
.badge-news { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
.badge-academic { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
.badge-patent { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
.badge-policy { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.badge-industry { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }

.article-content { flex: 1; }
.article-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  line-height: 1.5;
}
.article-summary {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 6px;
}
.article-meta {
  font-size: 11px;
  color: var(--text-secondary);
  display: flex;
  gap: 12px;
}
.score-bar {
  display: inline-block;
  width: 40px;
  height: 4px;
  background: var(--border-color);
  border-radius: 2px;
  vertical-align: middle;
  margin-left: 4px;
}
.score-fill {
  display: block;
  height: 100%;
  border-radius: 2px;
}

/* ===== Policy Countdown ===== */
.countdown-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-color);
}
.countdown-item:last-child { border-bottom: none; }
.countdown-days {
  width: 48px; height: 48px;
  border-radius: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-weight: 700;
  flex-shrink: 0;
}
.days-critical { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.days-high { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
.days-num { font-size: 16px; line-height: 1; }
.days-label { font-size: 9px; margin-top: 2px; }
.countdown-info { flex: 1; }
.countdown-title { font-size: 13px; font-weight: 600; }
.countdown-deadline { font-size: 11px; color: var(--text-secondary); }

/* ===== Source / Industry Distribution ===== */
.source-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.source-bar:last-child { margin-bottom: 0; }
.source-name {
  width: 60px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.source-track {
  flex: 1;
  height: 8px;
  background: var(--bg-primary);
  border-radius: 4px;
  overflow: hidden;
}
.source-fill {
  height: 100%;
  border-radius: 4px;
}
.source-count {
  width: 30px;
  font-size: 12px;
  text-align: right;
  color: var(--text-secondary);
  flex-shrink: 0;
}

/* ===== Weekly Judgment ===== */
.judgment-box {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
  border: 1px solid rgba(59, 130, 246, 0.2);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.judgment-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-blue);
  margin-bottom: 6px;
}
.judgment-text {
  font-size: 14px;
  line-height: 1.7;
}

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border-color);
  padding: 0 20px;
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab:hover, .tab.active {
  color: var(--accent-blue);
  border-bottom-color: var(--accent-blue);
}

/* ===== R&D Suggestions ===== */
.rd-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
  line-height: 1.6;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.rd-item:last-child { border-bottom: none; }
.rd-priority {
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.rd-priority.p0 { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.rd-priority.p1 { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
.rd-priority.p2 { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }

@media (max-width: 1024px) {
  .main { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
  <div style="background:var(--bg-primary);border-bottom:1px solid var(--border-color);padding:12px 24px;">
    <div style="max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;">
      <a href="index.html" style="color:var(--accent-blue);text-decoration:none;font-size:14px;font-weight:600;">← 返回驾驶舱首页</a>
      <span style="color:var(--text-secondary);font-size:12px;">CarbSeek Intelligence 实时情报中心</span>
    </div>
  </div>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>CarbSeek Intelligence</span>
    </div>
    <div class="header-meta">
      <span class="badge badge-live">● 实时追踪</span>
      <span id="report-meta">情报中心 v2.0</span>
    </div>
  </div>
</header>

<!-- Stats -->
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-value stat-total" id="stat-total">-</div>
    <div class="stat-label">总情报数</div>
  </div>
  <div class="stat-card">
    <div class="stat-value stat-today" id="stat-today">-</div>
    <div class="stat-label">今日新增</div>
  </div>
  <div class="stat-card">
    <div class="stat-value stat-week" id="stat-week">-</div>
    <div class="stat-label">本周新增</div>
  </div>
  <div class="stat-card">
    <div class="stat-value stat-high" id="stat-high">-</div>
    <div class="stat-label">高价值情报</div>
  </div>
  <div class="stat-card">
    <div class="stat-value stat-urgent" id="stat-urgent">-</div>
    <div class="stat-label">紧急政策</div>
  </div>
</div>

<!-- Main Content -->
<div class="main">
  <!-- Left Column -->
  <div class="left-col">

    <div class="judgment-box">
      <div class="judgment-label">📊 本周一句话判断</div>
      <div class="judgment-text" id="judgment-text"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📰 最新情报流</div>
        <span style="font-size:12px;color:var(--text-secondary);">按相关度排序</span>
      </div>
      <div class="tabs" id="article-tabs">
        <div class="tab active" data-type="all">全部</div>
        <div class="tab" data-type="policy">政策</div>
        <div class="tab" data-type="academic">学术</div>
        <div class="tab" data-type="patent">专利</div>
        <div class="tab" data-type="industry">行业</div>
      </div>
      <div class="card-body" id="article-list"></div>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-col">

    <div class="card">
      <div class="card-header">
        <div class="card-title">⏰ 政策倒计时</div>
      </div>
      <div class="card-body" id="countdown-list"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 情报来源分布</div>
      </div>
      <div class="card-body" id="source-dist"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">🏭 行业覆盖</div>
      </div>
      <div class="card-body" id="industry-dist"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">💡 研发建议</div>
      </div>
      <div class="card-body" id="rd-list"></div>
    </div>

  </div>
</div>

<!-- Footer -->
<div style="max-width:1440px;margin:0 auto;padding:20px 24px;border-top:1px solid var(--border-color);text-align:center;font-size:12px;color:var(--text-secondary);">
  <p>CarbSeek Intelligence · 碳足迹研发情报中心 · <a href="index.html" class="page-link">返回驾驶舱首页</a> · 每周自动更新 <span class="badge" style="background:rgba(245,158,11,0.15);color:var(--accent-amber);">演示数据</span></p>
</div>

<script src="assets/js/intelligence.js"></script>

</body>
</html>
