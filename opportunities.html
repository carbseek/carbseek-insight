<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机会库 | CarbSeek Insight</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* Stats Bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 16px 20px;
  text-align: center;
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--font-mono);
}
.stat-value.p0 { color: var(--accent-red); }
.stat-value.p1 { color: var(--accent-amber); }
.stat-value.p2 { color: var(--accent-green); }
.stat-value.total { color: var(--accent-blue); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

@media (max-width: 768px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
}

/* Opportunity Detail Card */
.opportunity-detail {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.opportunity-detail:hover { border-color: var(--accent-blue); }
.opportunity-detail:last-child { margin-bottom: 0; }

.opp-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.opp-id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  padding: 3px 10px;
  border-radius: 4px;
}
.opp-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.opp-badge {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.opp-badge.status-pending { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
.opp-badge.status-approved { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
.opp-badge.status-done { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
.opp-badge.grade-a { background: rgba(139, 92, 246, 0.1); color: var(--accent-purple); }
.opp-badge.grade-b { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
.opp-badge.grade-c { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); }
.opp-badge.industry {
  background: var(--bg-secondary);
  color: var(--text-secondary);
}

.opp-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  line-height: 1.5;
}

.opp-description {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 16px;
}

/* Score Grid */
.score-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.score-cell {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.score-label {
  font-size: 10px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.score-value {
  font-size: 20px;
  font-weight: 700;
  font-family: var(--font-mono);
}
.score-value.high { color: var(--accent-green); }
.score-value.medium { color: var(--accent-amber); }
.score-value.low { color: var(--accent-red); }

@media (max-width: 600px) {
  .score-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Impact Section */
.impact-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
}
.impact-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.impact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.impact-cell {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 12px;
  border-left: 3px solid;
}
.impact-cell.pro { border-color: var(--accent-blue); }
.impact-cell.scan { border-color: var(--accent-green); }
.impact-cell.db { border-color: var(--accent-purple); }
.impact-cell-title {
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 4px;
}
.impact-cell-title.pro { color: var(--accent-blue); }
.impact-cell-title.scan { color: var(--accent-green); }
.impact-cell-title.db { color: var(--accent-purple); }
.impact-cell-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

@media (max-width: 768px) {
  .impact-grid { grid-template-columns: 1fr; }
}

/* Meta Row */
.opp-meta-row {
  display: flex;
  gap: 20px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.opp-meta-row a {
  color: var(--accent-blue);
  text-decoration: none;
}

/* Priority Tabs */
.priority-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
}
.priority-tab {
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  transition: all 0.2s;
}
.priority-tab:hover { background: var(--bg-card); }
.priority-tab.active.p0-tab { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.priority-tab.active.p1-tab { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
.priority-tab.active.p2-tab { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
.priority-tab.active.all-tab { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>CarbSeek Insight</span>
    </div>
    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab">本周产业雷达</a>
      <a href="industry-chemical.html" class="nav-tab">化工</a>
      <a href="industry-electronics.html" class="nav-tab">电子电气</a>
      <a href="industry-automotive.html" class="nav-tab">汽车</a>
      <a href="industry-eu-export.html" class="nav-tab">欧盟出口</a>
      <a href="evidence.html" class="nav-tab">证据库</a>
      <a href="opportunities.html" class="nav-tab active">机会库</a>
    </nav>
    <div class="header-meta">
      <span id="report-meta"></span>
      <span id="opp-total"></span>
    </div>
  </div>
</header>

<main class="main">

  <!-- Stats(由 opportunities.js 按 priority 聚合渲染) -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- Priority Tabs -->
  <div class="priority-tabs">
    <button class="priority-tab all-tab active" data-filter="all">全部</button>
    <button class="priority-tab p0-tab" data-filter="p0">P0 紧急</button>
    <button class="priority-tab p1-tab" data-filter="p1">P1 重要</button>
    <button class="priority-tab p2-tab" data-filter="p2">P2 观察</button>
  </div>

  <!-- Opportunity Cards(由 opportunities.js 渲染,卡片 id 即锚点) -->
  <div id="opp-list"></div>

  <!-- Footer -->
  <div style="margin-top: 40px; padding: 20px 0; border-top: 1px solid var(--border-color); text-align: center; font-size: 12px; color: var(--text-secondary);">
    <p>CarbSeek Insight · 碳产业研发情报智能体 · 每周自动更新 <span class="badge" style="background: rgba(245,158,11,0.15); color: var(--accent-amber);">演示数据</span></p>
  </div>

</main>

<script src="assets/js/opportunities.js"></script>

</body>
</html>
