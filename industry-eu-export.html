<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧盟出口行业情报 | CarbSeek Insight</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* ===== 行业页专属样式(框架样式见 assets/css/base.css) ===== */

/* Industry Hero(默认化工蓝,其他行业由 body[data-industry] 覆盖) */
.industry-hero {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(6, 182, 212, 0.1));
  border: 1px solid rgba(59, 130, 246, 0.2);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.industry-hero h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}
.industry-hero p {
  font-size: 14px;
  color: var(--text-secondary);
}
.industry-stats {
  display: flex;
  gap: 24px;
}
.stat-box {
  text-align: center;
}
.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-blue);
  font-family: var(--font-mono);
}
.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* 电子电气:紫 */
body[data-industry="电子电气"] .industry-hero {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(59, 130, 246, 0.1));
  border-color: rgba(139, 92, 246, 0.2);
}
body[data-industry="电子电气"] .stat-num { color: var(--accent-purple); }

/* 汽车:琥珀 */
body[data-industry="汽车"] .industry-hero {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(239, 68, 68, 0.1));
  border-color: rgba(245, 158, 11, 0.2);
}
body[data-industry="汽车"] .stat-num { color: var(--accent-amber); }

/* 欧盟出口:红 */
body[data-industry="欧盟出口"] .industry-hero {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(245, 158, 11, 0.1));
  border-color: rgba(239, 68, 68, 0.2);
}
body[data-industry="欧盟出口"] .stat-num { color: var(--accent-red); }

/* Evidence Items */
.evidence-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border-color);
}
.evidence-item:last-child { border-bottom: none; padding-bottom: 0; }
.evidence-item:first-child { padding-top: 0; }
.evidence-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}
.evidence-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.evidence-tag {
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 500;
}
.evidence-tag.policy { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
.evidence-tag.academic { background: rgba(139, 92, 246, 0.1); color: var(--accent-purple); }
.evidence-tag.patent { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
.evidence-tag.competitor { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); }
.evidence-abstract {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* Opportunity Card */
.opp-card {
  padding: 14px;
  border-bottom: 1px solid var(--border-color);
  transition: background 0.2s;
}
.opp-card:hover { background: var(--bg-card-hover); }
.opp-card:last-child { border-bottom: none; }
.opp-card-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}
.opp-card-meta {
  display: flex;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
}

/* Recommendation List */
.rec-item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-color);
  align-items: flex-start;
}
.rec-item:last-child { border-bottom: none; }
.rec-icon {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.rec-icon.field { background: rgba(59, 130, 246, 0.15); }
.rec-icon.template { background: rgba(16, 185, 129, 0.15); }
.rec-icon.plugin { background: rgba(245, 158, 11, 0.15); }
.rec-text {
  font-size: 12px;
  line-height: 1.6;
  flex: 1;
}
</style>
</head>
<body data-industry="欧盟出口">

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>CarbSeek Insight</span>
    </div>
    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab">本周产业雷达</a>
      <a href="industry-chemical.html" class="nav-tab">化工</a>
      <a href="industry-electronics.html" class="nav-tab">电子电气</a>
      <a href="industry-automotive.html" class="nav-tab">汽车</a>
      <a href="industry-eu-export.html" class="nav-tab active">欧盟出口</a>
      <a href="evidence.html" class="nav-tab">证据库</a>
      <a href="opportunities.html" class="nav-tab">机会库</a>
    </nav>
    <div class="header-meta">
      <span id="report-id"></span>
    </div>
  </div>
</header>

<main class="main">

  <!-- Industry Hero -->
  <div class="industry-hero">
    <div>
      <h1 id="hero-title"></h1>
      <p id="hero-tagline"></p>
    </div>
    <div class="industry-stats">
      <div class="stat-box">
        <div class="stat-num" id="stat-evidence">-</div>
        <div class="stat-label">本周动态</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-opps">-</div>
        <div class="stat-label">产品机会</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-score">-</div>
        <div class="stat-label">热度指数</div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <!-- Latest Policy -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📋 最新政策</div>
      </div>
      <div class="card-body" id="policy-list"></div>
    </div>

    <!-- Latest Academic -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📚 最新论文</div>
      </div>
      <div class="card-body" id="academic-list"></div>
    </div>

    <!-- Latest Competitor -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🏢 代表企业动作</div>
      </div>
      <div class="card-body" id="company-list"></div>
    </div>

    <!-- CarbSeek Opportunities -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">💡 CarbSeek 产品机会</div>
        <a href="opportunities.html" class="page-link">查看全部 →</a>
      </div>
      <div class="card-body" style="padding: 0;" id="opp-list"></div>
    </div>
  </div>

  <!-- Recommendations -->
  <h2 class="section-title">CarbSeek 行动建议</h2>
  <div class="grid-3">
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔧 推荐新增字段</div>
      </div>
      <div class="card-body" id="rec-field"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">📄 推荐报告模板</div>
      </div>
      <div class="card-body" id="rec-template"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔌 推荐行业插件</div>
      </div>
      <div class="card-body" id="rec-plugin"></div>
    </div>
  </div>

  <!-- Footer -->
  <div style="margin-top: 40px; padding: 20px 0; border-top: 1px solid var(--border-color); text-align: center; font-size: 12px; color: var(--text-secondary);">
    <p>CarbSeek Insight · 碳产业研发情报智能体 · 每周自动更新 <span class="badge" style="background: rgba(245,158,11,0.15); color: var(--accent-amber);">演示数据</span></p>
  </div>

</main>

<script src="assets/js/industry.js"></script>

</body>
</html>
