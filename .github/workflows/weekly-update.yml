name: Weekly Content Update

on:
  schedule:
    # 北京时间每周一、周五 08:00（UTC 00:00）
      - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发：Actions 页面 → Weekly Content Update → Run workflow

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news & generate page
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: python3 scripts/weekly_update.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/auto/
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "无内容变化，跳过提交"
          else
            git commit -m "auto: $(TZ=Asia/Shanghai date +'%Y-%m-%d') 碳足迹情报自动更新"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 的 push 不会触发 pages.yml，因此这里直接完成部署
      - name: Setup Pages
        if: steps.commit.outputs.committed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
